const btn = document.getElementById('uploadBtn');
const input = document.getElementById('file');
const status = document.getElementById('status');
const canvas = document.getElementById('out');
const ctx = canvas.getContext('2d');
const download = document.getElementById('download');

btn.onclick = () => input.click();

function waitForImage(image) {
  return new Promise((resolve, reject) => {
    if (image.complete && image.naturalWidth) return resolve();
    image.onload = resolve;
    image.onerror = reject;
  });
}

function runFaceMesh(mesh, image) {
  return new Promise((resolve, reject) => {
    let finished = false;
    const timer = setTimeout(() => {
      if (!finished) {
        finished = true;
        reject(new Error('Истекло время распознавания лица'));
      }
    }, 12000);

    mesh.onResults(result => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      resolve(result.multiFaceLandmarks || []);
    });

    mesh.send({ image }).catch(error => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      reject(error);
    });
  });
}

function runFaceDetection(detector, image) {
  return new Promise((resolve, reject) => {
    let finished = false;
    const timer = setTimeout(() => {
      if (!finished) {
        finished = true;
        reject(new Error('Истекло время поиска лиц'));
      }
    }, 12000);

    detector.onResults(result => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      resolve(result.detections || []);
    });

    detector.send({ image }).catch(error => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      reject(error);
    });
  });
}

function getFaceBox(detection, width, height) {
  const box = detection.boundingBox;
  const x = box.xCenter * width;
  const y = box.yCenter * height;
  const w = box.width * width;
  const h = box.height * height;

  // Add margin: FaceDetection boxes can be tight around illustrated faces.
  const padX = w * 0.24;
  const padY = h * 0.30;
  const left = Math.max(0, Math.floor(x - w / 2 - padX));
  const top = Math.max(0, Math.floor(y - h / 2 - padY));
  const right = Math.min(width, Math.ceil(x + w / 2 + padX));
  const bottom = Math.min(height, Math.ceil(y + h / 2 + padY));

  return { x: left, y: top, w: right - left, h: bottom - top };
}

function eyeStripFromLandmarks(points, crop, imageWidth, imageHeight) {
  const a = points[33];
  const b = points[263];

  // Convert crop-relative FaceMesh coordinates into original-image coordinates.
  const ax = crop.x + a.x * crop.w;
  const ay = crop.y + a.y * crop.h;
  const bx = crop.x + b.x * crop.w;
  const by = crop.y + b.y * crop.h;

  const dx = bx - ax;
  const dy = by - ay;
  const distance = Math.hypot(dx, dy);
  if (!Number.isFinite(distance) || distance < 8) return null;

  return {
    x: (ax + bx) / 2,
    y: (ay + by) / 2,
    width: distance * 1.30,
    angle: Math.atan2(dy, dx)
  };
}

function isDuplicate(face, faces) {
  return faces.some(existing => {
    const d = Math.hypot(existing.x - face.x, existing.y - face.y);
    return d < Math.min(existing.width, face.width) * 0.55;
  });
}

input.onchange = async () => {
  const file = input.files && input.files[0];
  if (!file) return;

  status.textContent = 'Загружаем модели и ищем все лица…';
  canvas.style.display = 'none';
  download.style.display = 'none';

  const img = new Image();
  img.onload = async () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);

    let detector;
    let mesh;

    try {
      if (!window.FaceDetection || !window.FaceMesh) {
        throw new Error('Не удалось загрузить модели MediaPipe');
      }

      // FaceDetection first finds each face separately. This is more reliable
      // than asking FaceMesh to find every small/illustrated face in one pass.
      detector = new FaceDetection({
        locateFile: file =>
          'https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/' + file
      });
      detector.setOptions({
        model: 'full',
        minDetectionConfidence: 0.25
      });

      mesh = new FaceMesh({
        locateFile: file =>
          'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + file
      });
      mesh.setOptions({
        maxNumFaces: 5,
        refineLandmarks: true,
        minDetectionConfidence: 0.25,
        minTrackingConfidence: 0.25
      });

      const detections = await runFaceDetection(detector, img);
      const faces = [];

      // Run FaceMesh on each detected face crop. Small or partially covered
      // faces get a much larger input region than in the full-image pass.
      for (const detection of detections) {
        const crop = getFaceBox(detection, canvas.width, canvas.height);
        if (crop.w < 24 || crop.h < 24) continue;

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = crop.w;
        cropCanvas.height = crop.h;
        cropCanvas.getContext('2d').drawImage(
          img,
          crop.x, crop.y, crop.w, crop.h,
          0, 0, crop.w, crop.h
        );

        const landmarks = await runFaceMesh(mesh, cropCanvas);
        for (const points of landmarks) {
          const face = eyeStripFromLandmarks(
            points, crop, canvas.width, canvas.height
          );
          if (face && !isDuplicate(face, faces)) faces.push(face);
        }
      }

      // Fallback: also scan the whole image. It can find faces that the
      // face-box detector missed, while duplicate suppression avoids repeats.
      const fullImageLandmarks = await runFaceMesh(mesh, img);
      const fullCrop = { x: 0, y: 0, w: canvas.width, h: canvas.height };
      for (const points of fullImageLandmarks) {
        const face = eyeStripFromLandmarks(
          points, fullCrop, canvas.width, canvas.height
        );
        if (face && !isDuplicate(face, faces)) faces.push(face);
      }

      if (!faces.length) {
        status.textContent =
          'Не удалось найти лица. Попробуйте изображение с более чёткими лицами.';
        canvas.style.display = 'block';
        return;
      }

      await waitForImage(overlay);

      for (const face of faces) {
        const width = face.width;
        const height = width * (overlay.naturalHeight / overlay.naturalWidth);

        ctx.save();
        ctx.translate(face.x, face.y);
        ctx.rotate(face.angle);
        ctx.drawImage(overlay, -width / 2, -height / 2, width, height);
        ctx.restore();
      }

      status.textContent = `Готово! Найдено лиц: ${faces.length}.`;
      canvas.style.display = 'block';

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = 'modified-image.png';
      link.textContent = 'Скачать результат';
      download.replaceChildren(link);
      download.style.display = 'block';

    } catch (error) {
      console.error(error);
      status.textContent =
        'Не удалось выполнить распознавание. Проверьте подключение к интернету и попробуйте ещё раз.';
      canvas.style.display = 'block';
    } finally {
      if (detector && detector.close) detector.close();
      if (mesh && mesh.close) mesh.close();
    }
  };

  img.onerror = () => {
    status.textContent = 'Не удалось открыть этот файл.';
  };
  img.src = URL.createObjectURL(file);
};
</script></body></html>
